<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="archBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="roadGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow7" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad7)"/>

  <!-- Architectural Gateway Group -->
  <g transform="translate(256, 210)">
    <!-- Outer Decorative Arch Contour -->
    <path d="M -110,90 L -110,-10 C -110,-70 -75,-120 0,-120 C 75,-120 110,-70 110,-10 L 110,90" 
          fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3"/>

    <!-- Neo-Moorish Horseshoe Arch (Arc Outrepassé) -->
    <path d="M -85,90 L -85,10 C -85,-10 -95,-45 -65,-80 C -40,-108 40,-108 65,-80 C 95,-45 85,-10 85,10 L 85,90 L 60,90 L 60,15 C 60,-5 65,-30 45,-55 C 25,-75 -25,-75 -45,-55 C -65,-30 -60,-5 -60,15 L -60,90 Z" 
          fill="url(#archBlue)" filter="url(#glow7)"/>

    <!-- Keystone Crest at Arch Apex -->
    <polygon points="0,-128 -14,-100 14,-100" fill="#F59E0B"/>
    <circle cx="0" cy="-70" r="8" fill="#FDE68A"/>

    <!-- Perspective Highway Road Emerging from Gateway -->
    <polygon points="-8,-40 8,-40 50,90 -50,90" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
    
    <!-- Golden Center Lane Lines -->
    <line x1="0" y1="-30" x2="0" y2="-15" stroke="url(#roadGold)" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="0" y1="-5" x2="0" y2="15" stroke="url(#roadGold)" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="0" y1="28" x2="0" y2="58" stroke="url(#roadGold)" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="72" x2="0" y2="90" stroke="url(#roadGold)" stroke-width="6" stroke-linecap="round"/>

    <!-- Gateway Columns Capital & Base -->
    <rect x="-95" y="85" width="20" height="8" rx="2" fill="#F59E0B"/>
    <rect x="75" y="85" width="20" height="8" rx="2" fill="#F59E0B"/>
    <rect x="-92" y="10" width="14" height="6" rx="1" fill="#FDE68A"/>
    <rect x="78" y="10" width="14" height="6" rx="1" fill="#FDE68A"/>

    <!-- Twin Horizon Radiance Rays -->
    <line x1="-35" y1="-40" x2="35" y2="-40" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.6"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="700" font-size="20" fill="#F59E0B" text-anchor="middle" letter-spacing="4">وصلني • بوابة النقل الحضري والوطني</text>
</svg>
