<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad1)"/>
  
  <!-- Outer Decorative Ring -->
  <circle cx="256" cy="210" r="145" fill="none" stroke="#2563EB" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="6 6"/>
  <circle cx="256" cy="210" r="160" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Algerian Geometric Star (Khatam) Symbol -->
  <g transform="translate(256, 210)">
    <!-- 8-Pointed Star Layer 1 (Blue Diamond Corridors) -->
    <path d="M 0,-125 L 36,-36 L 125,0 L 36,36 L 0,125 L -36,36 L -125,0 L -36,-36 Z" 
          fill="url(#blueGrad1)" opacity="0.9" filter="url(#glow1)"/>
    
    <!-- 8-Pointed Star Layer 2 (Rotated 45 deg Diamond Roads) -->
    <path d="M 0,-125 L 36,-36 L 125,0 L 36,36 L 0,125 L -36,36 L -125,0 L -36,-36 Z" 
          transform="rotate(45)" 
          fill="url(#blueGrad1)" opacity="0.75"/>

    <!-- Inner Golden Mobility Intersection Core -->
    <polygon points="0,-70 20,-20 70,0 20,20 0,70 -20,20 -70,0 -20,-20" 
             fill="url(#goldGrad1)"/>

    <!-- Central Beacon Diamond -->
    <circle cx="0" cy="0" r="18" fill="#FFFFFF"/>
    <circle cx="0" cy="0" r="10" fill="#2563EB"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="700" font-size="20" fill="#F59E0B" text-anchor="middle" letter-spacing="4">وصلني • النقل الذكي المعتمد</text>
</svg>
