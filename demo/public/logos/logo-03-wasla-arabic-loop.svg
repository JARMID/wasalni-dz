<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="waslaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="40%" stop-color="#3B82F6"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FBBF24"/>
    </linearGradient>
    <filter id="loopGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad3)"/>

  <!-- Dynamic Orbit Grid -->
  <circle cx="256" cy="205" r="140" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2" stroke-dasharray="4 8"/>
  <circle cx="256" cy="205" r="110" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.15"/>

  <!-- Stylized Neo-Arabic Waw / Connection Infinity Loop -->
  <g transform="translate(256, 205)">
    <!-- Main Calligraphic Ribbon Form -->
    <path d="M -85,-15 
             C -85,-75 -35,-85 10,-85 
             C 70,-85 95,-45 95,5 
             C 95,65 55,95 -15,95 
             C -75,95 -95,45 -95,-15 
             C -95,-55 -65,-75 -25,-75
             C 25,-75 55,-45 55,0
             C 55,45 15,65 -25,65
             C -55,65 -65,35 -65,0
             L -65,115
             C -65,135 -85,145 -105,145"
          fill="none" 
          stroke="url(#waslaGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round"
          filter="url(#loopGlow)"/>

    <!-- Terminal Golden Pin Drop -->
    <circle cx="10" cy="-85" r="12" fill="#F59E0B"/>
    <circle cx="10" cy="-85" r="6" fill="#FFFFFF"/>

    <!-- Passenger & Driver Meeting Nodes -->
    <circle cx="-65" cy="0" r="10" fill="#2563EB"/>
    <circle cx="55" cy="0" r="10" fill="#F59E0B"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle">وَصَّلْنِي</text>
  <text x="256" y="450" font-family="'Inter', system-ui, sans-serif" font-weight="800" font-size="16" fill="#60A5FA" text-anchor="middle" letter-spacing="6">WASSLANI • MOBILITY</text>
</svg>
