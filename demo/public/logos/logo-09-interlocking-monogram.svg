<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="monoBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="monoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="shadow9" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="glow9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad9)"/>

  <!-- Subtle Geometric Lattice Backdrop -->
  <g opacity="0.12" stroke="#2563EB" stroke-width="1.5">
    <circle cx="256" cy="205" r="130" fill="none"/>
    <circle cx="256" cy="205" r="80" fill="none"/>
    <line x1="126" y1="205" x2="386" y2="205"/>
    <line x1="256" y1="75" x2="256" y2="335"/>
  </g>

  <!-- Interlocking Monogram (W + و) -->
  <g transform="translate(256, 205)">
    <!-- Latin 'W' Ribbon (Back Section) -->
    <path d="M -100,-75 L -65,65 L -30,-15 L 0,45 L 30,-15 L 65,65 L 100,-75" 
          fill="none" stroke="url(#monoBlue)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"
          filter="url(#glow9)"/>

    <!-- Arabic 'و' (Waw) Loop & Tail Threaded Through Center Vertex -->
    <!-- The head loop of Waw floats over the center of the W -->
    <g filter="url(#shadow9)">
      <!-- Waw Tail Swoosh -->
      <path d="M 0,-40 C 45,-40 60,10 40,55 C 20,95 -45,95 -80,75 C -92,68 -88,52 -74,58 C -48,70 5,68 18,35 C 28,15 15,-12 -8,-15 C -25,-17 -40,-8 -40,12" 
            fill="none" stroke="url(#monoGold)" stroke-width="24" stroke-linecap="round"/>
      
      <!-- Waw Head Eye Circle -->
      <path d="M -8,-15 C 10,-15 25,-32 25,-50 C 25,-68 10,-82 -8,-82 C -28,-82 -42,-68 -42,-50 C -42,-32 -28,-15 -8,-15 Z" 
            fill="url(#monoGold)"/>
      <circle cx="-8" cy="-50" r="11" fill="#0F172A"/>
    </g>

    <!-- Foreground Overlap Clamping of Latin W (giving real 3D interlocking illusion) -->
    <path d="M 12,20 L 0,45 L -12,20" 
          fill="none" stroke="url(#monoBlue)" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Subtle Dynamic Accent Nodes -->
    <circle cx="-100" cy="-75" r="7" fill="#60A5FA"/>
    <circle cx="100" cy="-75" r="7" fill="#60A5FA"/>
    <circle cx="-8" cy="-50" r="4" fill="#FFFFFF"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="700" font-size="20" fill="#F59E0B" text-anchor="middle" letter-spacing="4">وصلني • رمزية الهوية والتكامل الوطني</text>
</svg>
