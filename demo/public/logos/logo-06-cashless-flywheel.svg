<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="blueOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad6)"/>
  
  <!-- Subtle Orbital Track Rings -->
  <circle cx="256" cy="205" r="145" fill="none" stroke="#3B82F6" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="4 8"/>
  <circle cx="256" cy="205" r="120" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-opacity="0.2"/>

  <!-- Cashless Flywheel & Mobility Loop -->
  <g transform="translate(256, 205)">
    <!-- Blue Orbital Arc (Passenger to Platform Stream) -->
    <path d="M -95,-45 C -105,45 -35,105 50,95 C 95,90 115,55 105,25 C 98,6 78,0 60,15 C 30,38 -40,35 -60,-15 C -72,-48 -50,-80 -10,-95 C 10,-102 12,-118 -5,-116 C -50,-112 -85,-85 -95,-45 Z" 
          fill="url(#blueOrbit)" filter="url(#glow6)"/>
    
    <!-- Gold Orbital Arc (Platform to Driver Stream / Cashless Coin Flywheel) -->
    <path d="M 95,45 C 105,-45 35,-105 -50,-95 C -95,-90 -115,-55 -105,-25 C -98,-6 -78,0 -60,-15 C -30,-38 40,-35 60,15 C 72,48 50,80 10,95 C -10,102 -12,118 5,116 C 50,112 85,85 95,45 Z" 
          fill="url(#goldOrbit)"/>

    <!-- Central Cashless Digital Coin Core -->
    <circle cx="0" cy="0" r="42" fill="#0F172A" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="0" r="32" fill="url(#goldOrbit)" opacity="0.25"/>
    
    <!-- Digital Dinar / Pulse Symbol -->
    <path d="M -16,-12 L 0,-24 L 16,-12 L 16,12 L 0,24 L -16,12 Z" fill="none" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    
    <!-- Dynamic Orbiting Satellites / Nodes -->
    <circle cx="-100" cy="-25" r="7" fill="#60A5FA"/>
    <circle cx="100" cy="25" r="7" fill="#FDE68A"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="700" font-size="20" fill="#F59E0B" text-anchor="middle" letter-spacing="4">وصلني • الدفع الرقمي والتنقل السلس</text>
</svg>
