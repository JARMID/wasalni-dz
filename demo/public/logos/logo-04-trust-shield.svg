<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="shieldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldCar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad4)"/>

  <!-- Shield Shape -->
  <g transform="translate(256, 200)">
    <!-- Outer Shield Stroke -->
    <path d="M 0,-140 
             C 70,-140 120,-120 130,-100
             C 135,-30 130,50 0,140
             C -130,50 -135,-30 -130,-100
             C -120,-120 -70,-140 0,-140 Z" 
          fill="#1E293B" 
          stroke="url(#shieldBorder)" 
          stroke-width="12"/>

    <!-- Inner Shield Infill -->
    <path d="M 0,-125 
             C 60,-125 105,-105 115,-90
             C 120,-30 115,40 0,120
             C -115,40 -120,-30 -115,-90
             C -105,-105 -60,-125 0,-125 Z" 
          fill="#0F172A"/>

    <!-- Certified Star at Shield Apex -->
    <polygon points="0,-110 6,-95 22,-95 10,-85 14,-70 0,-80 -14,-70 -10,-85 -22,-95 -6,-95" 
             fill="#F59E0B"/>

    <!-- Stylized Modern Taxi Silhouette inside Shield -->
    <g transform="translate(0, 10)">
      <!-- Car Body -->
      <path d="M -55,30 
               L -50,12 
               L -35,-2 
               L -20,-18 
               L 20,-18 
               L 35,-2 
               L 50,12 
               L 55,30 
               Z" 
            fill="url(#goldCar)"/>
      
      <!-- Windshield -->
      <polygon points="-16,-14 16,-14 28,-3 -28,-3" fill="#0F172A"/>

      <!-- Roof Lantern on Car -->
      <rect x="-12" y="-24" width="24" height="5" rx="2" fill="#FFFFFF"/>

      <!-- Headlights -->
      <circle cx="-42" cy="18" r="5" fill="#FFFFFF"/>
      <circle cx="42" cy="18" r="5" fill="#FFFFFF"/>

      <!-- Wheels -->
      <circle cx="-35" cy="30" r="8" fill="#334155"/>
      <circle cx="35" cy="30" r="8" fill="#334155"/>
    </g>

    <!-- Verification Checkmark Ribbon -->
    <path d="M -25,60 L -6,78 L 28,45" 
          fill="none" 
          stroke="#3B82F6" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#F59E0B" text-anchor="middle" letter-spacing="4">SÉCURITÉ &amp; AGRÉMENT DTW</text>
</svg>
