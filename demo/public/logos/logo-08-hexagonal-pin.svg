<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="pinBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="interchangeGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="glow8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="96" fill="url(#bgGrad8)"/>

  <!-- Radar Scan Circles -->
  <circle cx="256" cy="195" r="140" fill="none" stroke="#2563EB" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="256" cy="195" r="115" fill="none" stroke="#F59E0B" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="6 6"/>

  <!-- Hexagonal Tech Map Marker -->
  <g transform="translate(256, 195)">
    <!-- Pin Silhouette Formed by Hexagonal Top & Tapered Base -->
    <path d="M 0,-115 L 85,-65 L 85,35 L 0,115 L -85,35 L -85,-65 Z" 
          fill="url(#pinBlueGrad)" filter="url(#glow8)"/>

    <!-- Inner Dark Glass Chamber -->
    <path d="M 0,-95 L 68,-55 L 68,25 L 0,90 L -68,25 L -68,-55 Z" 
          fill="#0F172A" opacity="0.85"/>

    <!-- Highway Cloverleaf Interchange (Golden Crossings) -->
    <g stroke="url(#interchangeGold)" stroke-width="6" fill="none" stroke-linecap="round">
      <!-- Curved Loop 1 (North-East Loop) -->
      <path d="M 0,-60 C 45,-60 45,0 0,0 C -45,0 -45,60 0,60"/>
      <!-- Curved Loop 2 (North-West Loop) -->
      <path d="M -50,-15 C -50,35 0,35 0,0 C 0,-35 50,-35 50,15"/>
    </g>

    <!-- Glowing Intersection Hub -->
    <circle cx="0" cy="0" r="14" fill="#0B132B" stroke="#F59E0B" stroke-width="3"/>
    <circle cx="0" cy="0" r="6" fill="#FFFFFF"/>
    
    <!-- Geolocation Pulse Dots -->
    <circle cx="0" cy="-60" r="4" fill="#FDE68A"/>
    <circle cx="0" cy="60" r="4" fill="#FDE68A"/>
    <circle cx="-50" cy="-15" r="4" fill="#60A5FA"/>
    <circle cx="50" cy="15" r="4" fill="#60A5FA"/>
  </g>

  <!-- Ground Target Echo -->
  <ellipse cx="256" cy="335" rx="35" ry="8" fill="none" stroke="#F59E0B" stroke-width="2" stroke-opacity="0.4"/>
  <ellipse cx="256" cy="335" rx="18" ry="4" fill="#F59E0B" fill-opacity="0.3"/>

  <!-- Brand Typography -->
  <text x="256" y="415" font-family="'Inter', system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#FFFFFF" text-anchor="middle" letter-spacing="8">WASSLANI</text>
  <text x="256" y="445" font-family="'Traditional Arabic', 'Amiri', serif" font-weight="700" font-size="20" fill="#F59E0B" text-anchor="middle" letter-spacing="4">وصلني • دقة التوجيه والموقع الذكي</text>
</svg>
